<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/fireIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Manager</title>
  </head>
  <body>
    <div id="root"></div>

    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');

      // O botão do VLibras fica num Shadow DOM e vem centralizado na vertical,
      // em cima das tabelas. Injetamos um estilo para subi-lo.
      (function moverBotaoVLibras(tentativas) {
        const host = document.getElementById('vlibras-access-wrapper');
        if (host && host.shadowRoot) {
          const style = document.createElement('style');
          style.textContent =
            '#vlibras-access { top: 120px !important; }' +
            '@media (min-width: 64rem) { #vlibras-access { top: 16px !important; } }';
          host.shadowRoot.appendChild(style);
        } else if (tentativas > 0) {
          setTimeout(function () { moverBotaoVLibras(tentativas - 1); }, 250);
        }
      })(40);
    </script>

    <!-- React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
