name: Feature Branch to Develop PR

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  create-pr:
    name: Create PR to Develop
    needs: build
    runs-on: ubuntu-latest
    if: success()

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: develop
          title: 'Merge ${{ github.ref_name }} into develop'
          body: |
            Auto-generated PR from feature branch ${{ github.ref_name }}
            
            Changes from: ${{ github.event.head_commit.message }}
            
            This PR was automatically created after successful build.
          delete-branch: false
